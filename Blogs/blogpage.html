<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Editorial Blog Listing | Reference Design</title>
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* =====================================================================
           DESIGN SYSTEM: identical tokens to ../index.html so both pages read
           as one product. Mint is the single accent for interaction; cyan is
           reserved for identifiers. Radius: 4px controls, 8px containers.
           ===================================================================== */
        :root {
            color-scheme: dark;

            --bg:        #000000;
            --bg-2:      #07090D;
            --surface:   #0D1218;
            --surface-2: #131A22;
            --line:      #253244;
            --line-soft: #1A2433;

            --ink:   #E6EDF5;
            --ink-2: #98A8BA;
            --ink-3: #7385A0;

            --accent:      #2BE8A4;
            --accent-dim:  #1E8F69;
            --accent-ink:  #04130D;
            --accent-soft: rgb(43 232 164 / 0.10);
            --accent-line: rgb(43 232 164 / 0.38);
            --accent-2:    #3CC8F0;

            --font-sans: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;

            --r-sm: 4px;
            --r-md: 8px;
            --ease: cubic-bezier(.2, .7, .2, 1);
            --t-fast: 160ms;
            --t-base: 280ms;
            --z-content: 1;
            --z-header: 20;
            --z-modal: 100;

            --header-h: 60px;
            --pad: clamp(20px, 4vw, 40px);

            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        *, *::before, *::after { box-sizing: border-box; }
        html { background: var(--bg); -webkit-text-size-adjust: 100%; }
        body {
            margin: 0; min-height: 100vh; display: flex; flex-direction: column;
            background: var(--bg); color: var(--ink);
            font-family: var(--font-sans); font-size: 1rem; line-height: 1.6;
            -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
        }
        h1, h2, h3, p { margin: 0; }
        a { color: inherit; }
        button, input, select { font: inherit; color: inherit; }
        ::selection { background: var(--accent-soft); color: var(--accent); }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: var(--r-sm); }
        [hidden], .hidden { display: none !important; }

        .wrap { max-width: 1120px; margin: 0 auto; padding: 0 var(--pad); width: 100%; }

        /* ---- Header (same treatment as the homepage) ---- */
        header {
            position: sticky; top: env(safe-area-inset-top, 0px); z-index: var(--z-header);
            background: color-mix(in srgb, var(--bg) 82%, transparent);
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line-soft);
        }
        .header-inner {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; column-gap: 24px; row-gap: 6px; min-height: var(--header-h);
        }
        .brand {
            font-family: var(--font-mono); font-weight: 500; font-size: 0.92rem;
            text-decoration: none; letter-spacing: -0.01em;
        }
        .brand::before { content: "> " / ""; color: var(--ink-3); }
        .brand .dot { color: var(--accent); }
        .header-right { display: flex; align-items: center; gap: 20px; font-size: 0.92rem; color: var(--ink-2); }
        .back { text-decoration: none; transition: color var(--t-fast) ease; }
        .back:hover { color: var(--accent); }

        /* ---- Page ---- */
        main { flex: 1 0 auto; position: relative; z-index: var(--z-content); padding-top: clamp(40px, 6vw, 72px); }
        .page-head { margin-bottom: 32px; }
        h1.page-title {
            font-size: clamp(1.75rem, 3.4vw, 2.6rem); font-weight: 700;
            line-height: 1.12; letter-spacing: -0.03em; text-wrap: balance;
        }

        /* ---- Toolbar ---- */
        .toolbar {
            display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; padding: 14px;
            background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-md);
        }
        @media (min-width: 768px) { .toolbar { flex-direction: row; align-items: center; } }
        .search { position: relative; flex: 1 1 auto; }
        .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--ink-3); pointer-events: none; }
        .control {
            width: 100%; min-height: 40px; padding: 0 12px;
            background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm);
            font-size: 0.9rem; color: var(--ink);
            transition: border-color var(--t-fast) ease, background-color var(--t-fast) ease;
        }
        .control::placeholder { color: var(--ink-3); }
        .control:hover { border-color: var(--accent-line); }
        .control:focus { outline: none; border-color: var(--accent); }
        .control:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .search .control { padding-left: 36px; padding-right: 12px; }
        .search .control:not(:placeholder-shown) { padding-right: 36px; }
        .clear-search {
            position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
            width: 32px; height: 32px; border: 0; background: transparent; cursor: pointer;
            color: var(--ink-3); font-size: 1.1rem; line-height: 1; border-radius: var(--r-sm);
            transition: color var(--t-fast) ease;
        }
        .clear-search:hover { color: var(--ink); }
        .selects { display: flex; flex-wrap: wrap; gap: 12px; }
        .select { position: relative; }
        .select select { appearance: none; -webkit-appearance: none; padding-right: 32px; cursor: pointer; width: auto; }
        .select::after {
            content: ""; position: absolute; right: 13px; top: 50%; width: 6px; height: 6px; pointer-events: none;
            border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3);
            transform: translateY(-70%) rotate(45deg);
        }
        .select option { background: var(--bg-2); color: var(--ink); }

        .status-line {
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
            margin-bottom: 20px; padding: 0 2px; font-family: var(--font-mono); font-size: 0.76rem; color: var(--ink-3);
        }
        .filter-badge { display: flex; align-items: center; gap: 12px; }
        .link-btn { border: 0; background: none; padding: 0; cursor: pointer; color: var(--accent); font-size: inherit; font-family: inherit; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 4px; transition: text-decoration-color var(--t-fast) ease; }
        .link-btn:hover { text-decoration-color: var(--accent); }

        /* ---- Feed ---- */
        .feed { display: flex; flex-direction: column; gap: 24px; }
        .post {
            background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-md);
            transition: border-color var(--t-base) ease, transform var(--t-base) var(--ease);
        }
        .post:hover { border-color: var(--accent-line); transform: translateY(-2px); }
        .post-link {
            display: flex; align-items: flex-start; gap: 24px; padding: 16px;
            text-decoration: none; color: inherit; border-radius: var(--r-md);
        }
        .thumb {
            flex: none; width: 254px; height: 133px; overflow: hidden;
            background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm);
        }
        .thumb img {
            display: block; width: 100%; height: 100%; object-fit: cover; object-position: center;
            transition: transform 0.5s var(--ease);
        }
        .post:hover .thumb img { transform: scale(1.03); }
        .post-body { flex: 1 1 auto; min-width: 0; }
        .post-title {
            font-size: 16px; font-weight: 700; line-height: 26px; letter-spacing: -0.005em;
            color: var(--ink); margin-bottom: 10px; transition: color var(--t-fast) ease;
            display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .post:hover .post-title { color: var(--accent); }
        .meta {
            display: flex; flex-wrap: wrap; align-items: center; column-gap: 20px; row-gap: 4px;
            font-family: var(--font-mono); font-size: 0.85rem; color: var(--ink-2);
        }
        .meta-item { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
        .meta svg { width: 12px; height: 12px; color: var(--ink-3); flex: none; }
        .meta .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); flex: none; }
        .meta .cats { text-transform: capitalize; }

        .state {
            padding: 48px 24px; text-align: center; color: var(--ink-3);
            background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-md);
        }
        .state h3 { font-size: 1rem; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
        .state-empty { padding: 64px 24px; }
        .state-empty h3 { margin: 0; font-size: 1.15rem; }
        .state p { font-size: 0.9rem; color: var(--ink-2); margin-bottom: 16px; }
        .spinner {
            width: 22px; height: 22px; margin: 0 auto 12px; border-radius: 50%;
            border: 2px solid var(--line); border-top-color: var(--accent); animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px;
            background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-sm);
            font-size: 0.9rem; font-weight: 500; cursor: pointer;
            transition: border-color var(--t-fast) ease, background-color var(--t-fast) ease, color var(--t-fast) ease, transform var(--t-fast) var(--ease);
        }
        .btn:hover { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent); }
        .btn:active { transform: translateY(1px) scale(0.98); }
        .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
        .btn-primary:hover { background: #5CF0BA; border-color: #5CF0BA; color: var(--accent-ink); }

        /* ---- Pagination ---- */
        .pagination {
            margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line-soft);
            display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
        }
        .page-btn {
            min-width: 36px; height: 36px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-sm);
            font-family: var(--font-mono); font-size: 0.8rem; cursor: pointer;
            transition: border-color var(--t-fast) ease, background-color var(--t-fast) ease, color var(--t-fast) ease;
        }
        .page-btn:hover:not(:disabled) { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent); }
        .page-btn[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ---- Footer ---- */
        footer { margin-top: clamp(56px, 8vw, 96px); border-top: 1px solid var(--line-soft); position: relative; z-index: var(--z-content); }
        .footer-inner { padding-top: 28px; padding-bottom: 36px; text-align: center; color: var(--ink-2); font-family: var(--font-mono); font-size: 0.8rem; }

        /* ---- Message modal ---- */
        .modal {
            position: fixed; inset: 0; z-index: var(--z-modal); display: flex; align-items: center; justify-content: center;
            background: rgb(0 0 0 / 0.72); opacity: 0; transition: opacity 0.2s ease;
        }
        .modal.hidden { display: none; }
        .modal.show { opacity: 1; }
        .modal-card { width: calc(100% - 32px); max-width: 384px; padding: 24px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-md); }
        .modal-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .modal-head h3 { font-size: 1rem; font-weight: 600; }
        .modal-mark { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); font-family: var(--font-mono); font-size: 0.8rem; }
        .modal-card p { color: var(--ink-2); font-size: 0.9rem; margin-bottom: 20px; }
        .modal-actions { display: flex; justify-content: flex-end; }

        /* ---- Responsive ---- */
        @media (max-width: 820px) {
            .post-link { gap: 18px; }
            .thumb { width: 200px; height: 105px; }
        }
        @media (max-width: 520px) {
            .brand { font-size: 0.86rem; }
            .post-link { flex-direction: column; gap: 14px; }
            .thumb { width: 100%; height: auto; aspect-ratio: 254 / 133; }
            .meta .dot { display: none; }
            .selects > .select { flex: 1 1 140px; }
            .selects .select select { width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            .post, .post:hover, .thumb img, .post:hover .thumb img, .btn, .btn:active { transition: none; transform: none; }
            .spinner { animation-duration: 2.4s; }
            .modal { transition: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="wrap header-inner">
            <a href="./blogpage.html" class="brand">Blogs:nayush<span class="dot">-</span>ghimire</a>
            <div class="header-right">
                <a href="../index.html" class="back"><span aria-hidden="true">&larr;</span> Portfolio</a>
            </div>
        </div>
    </header>

    <main>
        <div class="wrap">

            <div class="page-head">
                <h1 class="page-title">Published Blogs</h1>
            </div>

            <div id="toolbar" class="toolbar" role="search">
                <div class="search">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14"/></svg>
                    <input type="text" id="searchInput" class="control" placeholder="Search articles by title or category..." aria-label="Search articles by title or category" autocomplete="off">
                    <button type="button" id="clearSearchBtn" class="clear-search hidden" aria-label="Clear search">&times;</button>
                </div>
                <div class="selects">
                    <div class="select">
                        <select id="categorySelect" class="control" aria-label="Filter by category">
                            <option value="all">All categories</option>
                        </select>
                    </div>
                    <div class="select">
                        <select id="sortSelect" class="control" aria-label="Sort by">
                            <option value="newest">Newest</option>
                            <option value="oldest">Oldest</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="statusLine" class="status-line">
                <div id="resultsCount" aria-live="polite">Showing 0 posts</div>
                <div id="activeFilterBadge" class="filter-badge hidden">
                    <span>Filtering applied</span>
                    <button type="button" id="resetFiltersBtn" class="link-btn">Reset filters</button>
                </div>
            </div>

            <div id="blogFeed" class="feed">
                <div class="state">
                    <div class="spinner" aria-hidden="true"></div>
                    <p style="margin:0">Loading publications...</p>
                </div>
            </div>

            <nav id="paginationContainer" class="pagination hidden" aria-label="Pagination"></nav>

        </div>
    </main>

    <footer>
        <div class="wrap footer-inner">
            <p>&copy; 2026 Nayush Ghimire. All rights reserved.</p>
        </div>
    </footer>

    <div id="messageModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-card">
            <div class="modal-head">
                <span class="modal-mark" aria-hidden="true">i</span>
                <h3 id="modalTitle">Notice</h3>
            </div>
            <p id="modalMessage"></p>
            <div class="modal-actions">
                <button type="button" id="modalCloseBtn" class="btn btn-primary">Close</button>
            </div>
        </div>
    </div>

    <script>
        // State management
        let allBlogs = [];
        let filteredBlogs = [];
        let currentPage = 1;
        const postsPerPage = 5;

        // DOM Elements
        const blogFeed = document.getElementById('blogFeed');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const categorySelect = document.getElementById('categorySelect');
        const sortSelect = document.getElementById('sortSelect');
        const resultsCount = document.getElementById('resultsCount');
        const paginationContainer = document.getElementById('paginationContainer');
        const activeFilterBadge = document.getElementById('activeFilterBadge');
        const resetFiltersBtn = document.getElementById('resetFiltersBtn');

        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Escape text before it goes into markup (titles may contain quotes or ampersands)
        function esc(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        // Custom notification helper (no alerts)
        function showMessage(title, message) {
            const modal = document.getElementById('messageModal');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('show'), 10);
            document.getElementById('modalCloseBtn').focus();
        }

        document.getElementById('modalCloseBtn').addEventListener('click', () => {
            const modal = document.getElementById('messageModal');
            modal.classList.remove('show');
            setTimeout(() => modal.classList.add('hidden'), 200);
        });

        // Initialize and fetch blog JSON index
        async function initBlogPage() {
            let response;
            try {
                response = await fetch('./blogs.json');
            } catch (e) {
                // No index reachable (for example opened straight from disk): nothing is published yet
                showComingSoon();
                return;
            }

            // blogs.json has not been uploaded yet
            if (!response.ok) {
                showComingSoon();
                return;
            }

            try {
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error('blogs.json must contain an array of posts');
                allBlogs = data;
            } catch (error) {
                // The file exists but is broken, which needs fixing, so say so rather than hide it
                console.error("Error loading blogs.json:", error);
                blogFeed.innerHTML = `
                    <div class="state">
                        <h3>Could not load blog index</h3>
                        <p>Sorry. This is a server side error<br>Please Try Again Later</p>
                        <button type="button" onclick="initBlogPage()" class="btn">Retry Loading</button>
                    </div>
                `;
                return;
            }

            // An empty index means nothing is published yet
            if (allBlogs.length === 0) {
                showComingSoon();
                return;
            }

            processLoadedData();
        }

        // Nothing published: show only the message (no controls that would have nothing to act on)
        function showComingSoon() {
            document.getElementById('toolbar').classList.add('hidden');
            document.getElementById('statusLine').classList.add('hidden');
            paginationContainer.classList.add('hidden');
            blogFeed.innerHTML = '<div class="state state-empty"><h3>Blogs coming soon</h3></div>';
        }

        function processLoadedData() {
            populateCategories();
            applyFiltersAndSort();
        }

        // Populate category dropdown dynamically
        function populateCategories() {
            const categoriesSet = new Set();
            allBlogs.forEach(blog => {
                if (Array.isArray(blog.categories)) {
                    blog.categories.forEach(cat => categoriesSet.add(cat.trim().toLowerCase()));
                }
            });

            // Clear existing custom options (keep 'All categories')
            categorySelect.innerHTML = '<option value="all">All categories</option>';

            Array.from(categoriesSet).sort().forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                // Capitalize nicely for display
                option.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
                categorySelect.appendChild(option);
            });
        }

        // Apply Search, Filter, and Sort
        function applyFiltersAndSort() {
            const searchQuery = searchInput.value.trim().toLowerCase();
            const selectedCategory = categorySelect.value;
            const sortOrder = sortSelect.value;

            // Toggle clear search button
            if (searchQuery.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }

            // Filter
            filteredBlogs = allBlogs.filter(blog => {
                // Search filter (matches title or any category)
                let matchesSearch = true;
                if (searchQuery) {
                    const titleMatch = String(blog.title || '').toLowerCase().includes(searchQuery);
                    const categoryMatch = Array.isArray(blog.categories) && blog.categories.some(c => c.toLowerCase().includes(searchQuery));
                    matchesSearch = titleMatch || categoryMatch;
                }

                // Category filter
                let matchesCategory = true;
                if (selectedCategory !== 'all') {
                    matchesCategory = Array.isArray(blog.categories) && blog.categories.some(c => c.toLowerCase() === selectedCategory.toLowerCase());
                }

                return matchesSearch && matchesCategory;
            });

            // Sort (a missing or invalid date sorts as oldest; ties fall back to the numeric id)
            const time = d => { const t = Date.parse(d); return isNaN(t) ? 0 : t; };
            filteredBlogs.sort((a, b) => {
                const dateA = time(a.date);
                const dateB = time(b.date);

                if (sortOrder === 'newest') {
                    if (dateB - dateA !== 0) return dateB - dateA;
                    return b.id - a.id; // Tie-breaker by numeric blog identifier
                } else {
                    if (dateA - dateB !== 0) return dateA - dateB;
                    return a.id - b.id; // Tie-breaker by numeric blog identifier
                }
            });

            // Reset to page 1 on filter/search/sort change
            currentPage = 1;

            // Check if any filter is active
            if (searchQuery || selectedCategory !== 'all') {
                activeFilterBadge.classList.remove('hidden');
            } else {
                activeFilterBadge.classList.add('hidden');
            }

            renderCurrentPage();
        }

        // Render current page feed and pagination
        function renderCurrentPage() {
            const totalPosts = filteredBlogs.length;
            resultsCount.textContent = `Showing ${totalPosts} ${totalPosts === 1 ? 'post' : 'posts'}`;

            if (totalPosts === 0) {
                blogFeed.innerHTML = `
                    <div class="state">
                        <h3>No matching publications found</h3>
                        <p>Try adjusting your search query or category filter.</p>
                        <button type="button" onclick="resetAllFilters()" class="btn">Clear Filters</button>
                    </div>
                `;
                paginationContainer.classList.add('hidden');
                return;
            }

            // Pagination slice
            const startIndex = (currentPage - 1) * postsPerPage;
            const endIndex = startIndex + postsPerPage;
            const currentPosts = filteredBlogs.slice(startIndex, endIndex);

            // Build HTML for blog feed items (Strict adherence to 3 elements: Thumbnail, Headline, Metadata row)
            const calendarIcon = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>';
            let feedHtml = '';
            currentPosts.forEach(post => {
                const formattedDate = formatDate(post.date);
                const categoriesText = Array.isArray(post.categories)
                    ? post.categories.join(', ')
                    : (post.categories || '');

                const dateItem = formattedDate
                    ? `<span class="meta-item">${calendarIcon}<span>${esc(formattedDate)}</span></span>`
                    : '';
                const catItem = categoriesText
                    ? `<span class="meta-item">${formattedDate ? '<span class="dot" aria-hidden="true"></span>' : ''}<span class="cats">${esc(categoriesText)}</span></span>`
                    : '';

                feedHtml += `
                    <article class="post">
                        <a href="${esc(post.url)}" class="post-link">
                            <!-- Left Column: Cover Thumbnail (approx 254x133px, 1.9:1) -->
                            <div class="thumb">
                                <img src="${esc(post.cover)}" alt="${esc(post.title)}" width="254" height="133" loading="lazy" onerror="this.onerror=null;this.style.display='none';">
                            </div>
                            <!-- Right Column: Headline & Metadata Row -->
                            <div class="post-body">
                                <h2 class="post-title">${esc(post.title)}</h2>
                                <div class="meta">${dateItem}${catItem}</div>
                            </div>
                        </a>
                    </article>
                `;
            });

            blogFeed.innerHTML = feedHtml;
            renderPagination(filteredBlogs.length);
        }

        // Render Pagination Controls
        function renderPagination(totalPosts) {
            const totalPages = Math.ceil(totalPosts / postsPerPage);

            if (totalPages <= 1) {
                paginationContainer.classList.add('hidden');
                return;
            }

            paginationContainer.classList.remove('hidden');
            let paginationHtml = '';

            // Previous Button
            paginationHtml += `
                <button type="button" onclick="changePage(${currentPage - 1})" class="page-btn" ${currentPage === 1 ? 'disabled' : ''}>
                    <span aria-hidden="true">&lsaquo;</span> Prev
                </button>
            `;

            // Numbered Page Buttons
            for (let i = 1; i <= totalPages; i++) {
                const isActive = i === currentPage;
                paginationHtml += `
                    <button type="button" onclick="changePage(${i})" class="page-btn" ${isActive ? 'aria-current="page"' : ''} aria-label="Page ${i}">${i}</button>
                `;
            }

            // Next Button
            paginationHtml += `
                <button type="button" onclick="changePage(${currentPage + 1})" class="page-btn" ${currentPage === totalPages ? 'disabled' : ''}>
                    Next <span aria-hidden="true">&rsaquo;</span>
                </button>
            `;

            paginationContainer.innerHTML = paginationHtml;
        }

        function changePage(targetPage) {
            const totalPages = Math.ceil(filteredBlogs.length / postsPerPage);
            if (targetPage < 1 || targetPage > totalPages) return;
            currentPage = targetPage;
            renderCurrentPage();
            window.scrollTo({ top: 0, behavior: reducedMotion ? 'auto' : 'smooth' });
        }

        function resetAllFilters() {
            searchInput.value = '';
            categorySelect.value = 'all';
            sortSelect.value = 'newest';
            applyFiltersAndSort();
        }

        // Dates are stored as calendar dates (YYYY-MM-DD); format them in UTC so a
        // visitor in a US timezone does not see the previous day.
        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return '';
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'UTC' });
        }

        // Event Listeners
        searchInput.addEventListener('input', applyFiltersAndSort);
        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            applyFiltersAndSort();
        });
        categorySelect.addEventListener('change', applyFiltersAndSort);
        sortSelect.addEventListener('change', applyFiltersAndSort);
        resetFiltersBtn.addEventListener('click', resetAllFilters);

        // Run initialization on window load
        window.onload = function() {
            initBlogPage();
        };
    </script>
